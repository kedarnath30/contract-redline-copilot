[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-redline-copilot"
version = "0.1.0"
description = "Playbook-grounded contract redline copilot with an evaluation and drift harness."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kedarnath Pandiri", email = "kedarnathpandiri4@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "httpx>=0.27",
]

[project.optional-dependencies]
mlops = ["mlflow>=2.12"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
redline = "redline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
