name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      REDLINE_BACKEND: offline  # CI is fully offline: no API keys, no network calls
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,mlops]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: Eval (quality gate)
        run: |
          redline eval --name dev --out reports/eval_dev.json --mlflow --min-type-accuracy 0.85 --min-citation 0.9
          redline eval --gold data/gold/blind.jsonl --name blind --out reports/eval_blind.json --mlflow
      - name: Drift demo (shifted batch must alert)
        run: |
          redline drift --out reports/drift_clean.json --fail-on-alert
          ! redline drift --inject-shift --out reports/drift_shifted.json --fail-on-alert
      - uses: actions/upload-artifact@v4
        with:
          name: eval-and-drift
          path: |
            reports/
            mlruns/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t contract-redline-copilot:ci .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name app contract-redline-copilot:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs -X POST localhost:8000/review -H 'content-type: application/json' \
            -d '{"text":"This Agreement shall be governed by the laws of England and Wales."}'
